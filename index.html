<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>みんなのミネラル石けん部</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<meta name="theme-color" content="#d6d0f4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="石けん部">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation;background:#cfc8ee}
body{display:flex;justify-content:center;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif}
#app{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden;background:#d6d0f4}
.screen{position:absolute;inset:0;background-repeat:no-repeat;background-size:cover}

/* ===== スタート画面 ===== */
#title{z-index:2;background-image:url(title-bg.jpg);background-position:center;cursor:pointer;transition:opacity .6s ease}
#title.out{opacity:0;pointer-events:none}
#logo{position:absolute;left:50%;top:calc(11% + env(safe-area-inset-top,0px));width:min(92%,430px);height:auto;transform:translateX(-50%);animation:sway 4.8s ease-in-out infinite;pointer-events:none}
@keyframes sway{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1.2deg)}50%{transform:translateX(-50%) translateY(-5px) rotate(1.2deg)}}
#tap{position:absolute;left:50%;bottom:calc(11% + env(safe-area-inset-bottom,0px));width:min(80%,340px);height:auto;transform:translateX(-50%);animation:blink 1.5s ease-in-out infinite;pointer-events:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ===== ホーム画面 ===== */
#home{z-index:1;background-image:url(home-bg.jpg);background-position:center bottom}
#chara{position:absolute;left:50%;bottom:calc(7% + env(safe-area-inset-bottom,0px));height:min(66%,720px);transform:translateX(-50%);opacity:0;transition:opacity .9s ease .25s}
#chara img{display:block;height:100%;width:auto}
#chara::before{content:"";position:absolute;left:50%;bottom:-1.2%;width:70%;height:3.2%;transform:translateX(-50%);border-radius:50%;background:rgba(70,50,60,.28);filter:blur(5px)}
#home.show #chara{opacity:1}
/* ===== ホーム画面のUI(やわらかいパステル・シャボン玉) ===== */
.ui{opacity:0;pointer-events:none;transition:opacity .9s ease .35s}
#home.show .ui{opacity:1}
#hud{position:absolute;left:8px;top:calc(8px + env(safe-area-inset-top,0px));--w:min(72vw,300px);width:var(--w);filter:drop-shadow(0 3px 6px rgba(90,100,170,.18))}
#hud img{display:block;width:100%;height:auto}
#clock{position:absolute;left:24%;right:24%;top:58%;transform:translateY(-50%);display:flex;align-items:baseline;justify-content:center;gap:calc(var(--w) * .025);color:#5560c8;font-weight:800;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.95),0 0 6px rgba(255,255,255,.8)}
#clockDate{font-size:calc(var(--w) * .046)}
#clockTime{font-size:calc(var(--w) * .066);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hbtn{padding:0;border:none;background:none;width:min(25vw,100px);cursor:pointer;-webkit-appearance:none;appearance:none;animation:floaty 4s ease-in-out infinite;transition:transform .12s ease}
.hbtn img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(90,100,170,.25))}
#home.show .hbtn{pointer-events:auto}
.hbtn:active{transform:scale(.93)}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -3px}}
#btnTodo{position:absolute;left:6px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#rcol{position:absolute;right:6px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#toast{position:absolute;left:50%;top:calc(78px + env(safe-area-inset-top,0px));transform:translate(-50%,-6px);padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.93);color:#5560c8;font-weight:800;font-size:14px;white-space:nowrap;border:2px solid #b9c0f2;box-shadow:0 4px 10px rgba(110,120,210,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Todoページ(やわらかいパステル・ポップ) ===== */
#todo{z-index:10;display:none;flex-direction:column;background:rgba(246,241,255,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#4b4fa0;opacity:0;transform:scale(.97);transition:opacity .25s ease,transform .35s cubic-bezier(.2,1.3,.4,1)}
#todo.open{display:flex}
#todo.on{opacity:1;transform:none}
#todo button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;transition:transform .1s ease}
#todo button:active{transform:scale(.93)}
#todo .ic{width:24px;height:24px;display:block;flex:none}
#todo .ic.big{width:38px;height:38px}
#tHead{flex:none;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(4px + env(safe-area-inset-top,0px)) 12px 0 6px}
#tTitle{width:150px;height:auto;filter:drop-shadow(0 4px 6px rgba(90,100,170,.25))}
#tRight{display:flex;align-items:center;gap:6px;margin-top:12px}
.pill{display:flex;align-items:center;gap:3px;padding:3px 10px 3px 6px;border-radius:999px;background:linear-gradient(#fff,#eeeaff);border:2px solid rgba(150,140,232,.55);font-weight:800;font-size:15px;box-shadow:0 3px 8px rgba(110,100,200,.15)}
.pill[hidden]{display:none}
.pill.pop{animation:pillPop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes pillPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.xbtn{width:44px;height:44px;border-radius:50%;background:linear-gradient(#fff,#e4e0fa)!important;border:3px solid rgba(150,140,232,.7)!important;display:grid;place-items:center;box-shadow:0 4px 10px rgba(110,100,200,.25)}
.xbtn .ic{width:22px;height:22px}
#tMain{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px calc(104px + env(safe-area-inset-bottom,0px))}
.tcard{margin:6px 0 14px;padding:12px 14px 16px;border-radius:30px;background:linear-gradient(rgba(255,255,255,.84),rgba(236,232,252,.8));border:2px solid rgba(150,140,232,.55);box-shadow:0 8px 22px rgba(110,100,200,.2),inset 0 2px 0 rgba(255,255,255,.9)}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chead h2{margin:0;font-size:20px;font-weight:800;flex:1}
.count{padding:5px 16px;border-radius:999px;background:linear-gradient(#c9bdf7,#a99bf0);color:#fff;font-weight:800;font-size:18px;text-shadow:0 1px 2px rgba(90,80,190,.5)}
.trow{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:9px 8px 9px 12px;border-radius:22px;background:linear-gradient(#fff,rgba(246,244,255,.92));border:2px solid rgba(170,160,238,.42);box-shadow:0 3px 8px rgba(120,110,200,.12)}
.trow.new{animation:rowIn .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes rowIn{0%{transform:scale(.8) translateY(14px);opacity:0}100%{transform:none;opacity:1}}
.chk{flex:none;width:36px;height:36px;border-radius:50%;border:3px solid #c7c4de!important;background:#fff!important;display:grid;place-items:center;transition:background .2s,border-color .2s}
.chk .ic{width:20px;height:20px;opacity:0;transform:scale(.3);transition:opacity .15s,transform .35s cubic-bezier(.2,1.9,.4,1)}
.trow.done .chk{background:linear-gradient(#a7d8ff,#6f94ff)!important;border-color:#5964e0!important}
.trow.done .chk .ic{opacity:1;transform:scale(1)}
.chk.pop{animation:chkPop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes chkPop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
#todo .ttxt{flex:1;min-width:0;text-align:left;font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 0}
.trow.done .ttxt{text-decoration:line-through;opacity:.55}
.rew{flex:none;display:flex;align-items:center;gap:2px;font-weight:800;font-size:16px;color:#5560c8}
.rew .ic{width:22px;height:22px}
.chev{flex:none;width:26px;height:34px;display:grid;place-items:center}
.chev .ic{width:18px;height:18px}
.empty{padding:22px 8px 14px;text-align:center;font-weight:500;font-size:15px;line-height:1.7;opacity:.8}
#todo .addbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto 0;padding:12px 28px;border-radius:999px;background:linear-gradient(#b3deff,#6f94ff 85%);border:3px solid #5964e0;color:#fff;font-weight:800;font-size:19px;text-shadow:0 2px 0 #4a55c0,0 0 6px rgba(70,80,200,.45);box-shadow:0 5px 0 #4650b8,0 9px 14px rgba(80,90,200,.28),inset 0 3px 0 rgba(255,255,255,.55)}
#todo .addbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #4650b8,0 3px 8px rgba(80,90,200,.2),inset 0 3px 0 rgba(255,255,255,.55)}
#track{position:relative;padding:6px 4px 0}
#trackLine{position:absolute;left:16.7%;right:16.7%;top:41px;height:12px;margin-top:-6px;border-radius:6px;background:rgba(190,180,240,.5)}
#trackFill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#a7d8ff,#c4a3ff);transition:width .6s cubic-bezier(.2,1.2,.4,1)}
#nodes{position:relative;display:grid;grid-template-columns:repeat(3,1fr)}
.node{display:flex;flex-direction:column;align-items:center;gap:6px}
#todo .nbub{position:relative;width:68px;height:66px;border-radius:22px;background:linear-gradient(#fff,#e9e5fb);border:3px solid rgba(150,140,232,.55);display:grid;place-items:center;box-shadow:0 4px 10px rgba(110,100,200,.2)}
#todo .node:not(.ready):not(.got) .nbub{opacity:.78;filter:saturate(.75)}
#todo .node.ready .nbub{border-color:#f5b02e;animation:nodeReady 1s ease-in-out infinite;box-shadow:0 0 0 4px rgba(255,214,90,.35),0 6px 14px rgba(240,170,40,.35)}
@keyframes nodeReady{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.06)}}
#todo .node.got .nbub{background:linear-gradient(#f4f1ff,#e1dcf7)}
#todo .nbub .ic{width:42px;height:42px}
.nstar{position:relative;display:grid;place-items:center}
.nstar em{position:absolute;bottom:-6px;right:-12px;font-style:normal;font-weight:800;font-size:15px;color:#5560c8;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.ok{position:absolute;right:-9px;top:-9px;width:26px;height:26px;border-radius:50%;background:#6fdc8c;border:2px solid #fff;display:grid;place-items:center}
#todo .ok .ic{width:15px;height:15px}
.nlab{font-weight:800;font-size:14px}
.node.ready .nlab{color:#e08a00}
#tNav{position:absolute;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));height:72px;display:flex;align-items:flex-end;justify-content:space-around;gap:2px;padding:0 6px 6px;border-radius:36px;background:linear-gradient(rgba(255,255,255,.9),rgba(228,222,250,.92));border:2px solid rgba(150,140,232,.55);box-shadow:0 8px 20px rgba(110,100,200,.25),inset 0 2px 0 #fff}
#todo .ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 2px;font-size:11px;font-weight:800;color:#6a70c8;white-space:nowrap}
#todo .ntab .ic{width:30px;height:30px}
#todo .ntab.act{flex:1.3;transform:translateY(-14px);padding:10px 0 8px;border-radius:30px;background:linear-gradient(#c3e5ff,#82a6ff);border:2px solid #fff;box-shadow:0 6px 14px rgba(90,110,220,.4),inset 0 3px 0 rgba(255,255,255,.6);color:#fff;text-shadow:0 1px 3px #4a55c0;font-size:12px}
#todo .ntab.act:active{transform:translateY(-12px) scale(.95)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.spk{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;animation:spk .75s ease-out forwards}
.spk.bub{width:11px;height:11px;margin:-5px 0 0 -5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9e4ff 60%,#c9b8ff);border:1.5px solid #8fa0f0}
.spk .ic{width:100%!important;height:100%!important}
@keyframes spk{0%{transform:translate(0,0) scale(.4);opacity:1}60%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(40deg);opacity:0}}
.ftxt{position:absolute;transform:translateX(-50%);font-weight:800;font-size:19px;color:#e08a00;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;animation:ftxt .9s ease-out forwards;white-space:nowrap}
@keyframes ftxt{0%{transform:translate(-50%,0) scale(.6);opacity:0}25%{transform:translate(-50%,-10px) scale(1.2);opacity:1}100%{transform:translate(-50%,-48px) scale(1);opacity:0}}
#sheetWrap{position:absolute;inset:0;z-index:7;display:none;align-items:flex-end;background:rgba(70,70,140,.3)}
#sheetWrap.on{display:flex}
.sheet{width:100%;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:32px 32px 0 0;background:linear-gradient(#fff,#efeafc);border:2px solid rgba(150,140,232,.6);border-bottom:0;box-shadow:0 -8px 24px rgba(90,90,190,.25);animation:sheetUp .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes sheetUp{0%{transform:translateY(60px);opacity:0}100%{transform:none;opacity:1}}
.sheet h3{margin:0 0 12px;font-size:19px;font-weight:800;text-align:center}
#sheetInput{width:100%;font:inherit;font-size:18px;font-weight:500;padding:12px 14px;border-radius:18px;border:3px solid #b9b4ec;background:#fff;color:#4b4fa0;outline:none;-webkit-user-select:text;user-select:text;-webkit-appearance:none}
#sheetInput.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.chips{display:flex;gap:8px;margin:12px 0}
#todo .chip{flex:1;padding:8px 0;border-radius:999px;border:3px solid #c7c4de;background:#fff;font-weight:800;color:#6a70c8;display:flex;align-items:center;justify-content:center;gap:4px}
#todo .chip .ic{width:20px;height:20px}
#todo .chip.on{background:linear-gradient(#fff2b8,#ffd54a);border-color:#f0a92b;color:#8a5a00}
.sbtns{display:flex;gap:8px}
#todo .sbtns button{flex:1;padding:12px 0;border-radius:999px;font-weight:800;font-size:16px;border:3px solid #c7c4de;background:#fff;color:#6a70c8}
#todo #sheetOk{background:linear-gradient(#b3deff,#6f94ff);border-color:#5964e0;color:#fff;text-shadow:0 1px 2px rgba(60,70,190,.6)}
#todo #sheetDel{background:linear-gradient(#ffd6e8,#ff9ccb);border-color:#e0609a;color:#fff;text-shadow:0 1px 2px rgba(190,60,120,.5)}
#ttoast{position:absolute;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.95);color:#5560c8;font-weight:800;font-size:14px;white-space:nowrap;border:2px solid #b9c0f2;box-shadow:0 4px 10px rgba(110,120,210,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9}
#ttoast.show{opacity:1;transform:translate(-50%,0)}

/* ===== ミニゲーム ===== */
#mg{z-index:12;display:none;opacity:0;transform:scale(.97);transition:opacity .25s ease,transform .35s cubic-bezier(.2,1.3,.4,1);color:#5560c8;touch-action:none;background:#cfe0ff}
#mg.open{display:block}
#mg.on{opacity:1;transform:none}
#mg button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;transition:transform .1s ease}
#mg button:active{transform:scale(.93)}
#mg .ic{width:24px;height:24px;display:block;flex:none}
#mgCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#mgHud{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:none;justify-content:space-between;align-items:flex-start;pointer-events:none}
#mg.hud #mgHud{display:flex}
.hp{display:flex;flex-direction:column;align-items:center;padding:5px 20px 4px;min-width:96px;border-radius:30px;background:linear-gradient(rgba(255,255,255,.9),rgba(222,232,255,.85));border:3px solid #fff;box-shadow:0 5px 12px rgba(100,120,210,.25),inset 0 -3px 0 rgba(150,170,240,.3);line-height:1.05}
.hp small{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:#6ea6ff;-webkit-text-stroke:3px #fff;paint-order:stroke fill;letter-spacing:.04em}
.hp small .ic{width:18px;height:18px}
.hp b{font-size:32px;font-weight:800;color:#7a72d8;text-shadow:0 2px 0 rgba(255,255,255,.9)}
#mgBest{margin-left:auto;margin-right:10px;position:relative}
#mgBest b{font-size:28px}
#mgPause{width:50px;height:50px;border-radius:50%;pointer-events:auto;background:linear-gradient(#fff,#dfe6ff)!important;border:3px solid #fff!important;box-shadow:0 5px 12px rgba(100,120,210,.28);display:grid;place-items:center}
#mgHint{position:absolute;left:50%;top:58%;transform:translateX(-50%);display:none;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.9);border:3px solid #b9c0f2;font-weight:800;font-size:17px;white-space:nowrap;box-shadow:0 5px 12px rgba(100,120,210,.25);animation:hintB 1s ease-in-out infinite;pointer-events:none}
#mg.ready #mgHint{display:block}
@keyframes hintB{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.mgp{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(214,226,255,.55),rgba(236,226,252,.7));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#mg.st-start #mgStart,#mg.st-over #mgOver,#mg.st-pause #mgPauseP{display:flex;animation:panelIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes panelIn{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:none}}
.mgx{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:50%;background:linear-gradient(#fff,#e4e0fa)!important;border:3px solid rgba(150,140,232,.7)!important;display:grid;place-items:center}
.mglogo{width:min(86%,380px);height:auto;filter:drop-shadow(0 6px 10px rgba(100,110,200,.25))}
.mgtag{padding:5px 22px;border-radius:999px;background:linear-gradient(#fff3d6,#ffe0b0);border:3px solid #fff;color:#c9803a;font-weight:800;font-size:18px;box-shadow:0 4px 10px rgba(220,160,90,.3);margin-top:-6px}
.mgrow{display:flex;align-items:center;gap:6px;width:100%;max-width:400px;justify-content:center}
.mgchar{width:38%;max-width:150px;aspect-ratio:1/1;object-fit:contain;animation:mgBob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(100,110,200,.25))}
@keyframes mgBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
.mgbub{position:relative;flex:1;padding:12px 14px;border-radius:26px;background:rgba(255,255,255,.95);border:3px solid #cfd2f5;font-weight:800;font-size:15px;line-height:1.5;text-align:center;box-shadow:0 5px 10px rgba(100,110,200,.18)}
.mgbub::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:12px solid #cfd2f5;border-left:0}
.mgbub span{color:#ff8fb8;margin-left:2px}
#mg .mgbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 30px;border-radius:999px;font-weight:800;font-size:21px;color:#fff;border:3px solid #fff;text-shadow:0 2px 3px rgba(80,70,190,.45)}
#mg .mgbtn.purple{background:linear-gradient(#cbb8ff,#9c84f2);box-shadow:0 6px 0 #7d68d6,0 10px 16px rgba(110,90,210,.3),inset 0 3px 0 rgba(255,255,255,.5);min-width:200px}
#mg .mgbtn.lav{background:linear-gradient(#d3d9ff,#a6b0f3);box-shadow:0 6px 0 #8089d8,0 10px 16px rgba(110,120,210,.3),inset 0 3px 0 rgba(255,255,255,.5)}
#mg .mgbtn.pink{background:linear-gradient(#ffc6e3,#f08fc4);box-shadow:0 6px 0 #d46fa6,0 10px 16px rgba(210,110,160,.3),inset 0 3px 0 rgba(255,255,255,.5)}
#mg .mgbtn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.mgbtn .ic{width:26px;height:26px}
.mgbtns{display:flex;gap:12px;margin-top:6px}
#mg .mgbtn{white-space:nowrap}
.mgbtns .mgbtn{font-size:19px;padding:12px 22px}
.mgover{display:flex;flex-direction:column;align-items:center;line-height:.95;margin-bottom:6px}
.mgover span{font-weight:800;font-size:74px;letter-spacing:.02em;-webkit-text-stroke:9px #fff;paint-order:stroke fill;text-shadow:0 6px 0 rgba(120,130,230,.45)}
.go1{color:#6ec3ff}
.go2{color:#ff9ccb;margin-top:-6px}
.mgres{display:flex;align-items:center;gap:8px;width:100%;max-width:420px;justify-content:center}
.mgfall{width:52%;max-width:210px;height:auto;filter:drop-shadow(0 6px 8px rgba(100,110,200,.25))}
.mgpills{display:flex;flex-direction:column;gap:10px;flex:1}
.hp.big{width:100%;padding:8px 14px 6px;position:relative}
.hp.big b{font-size:40px}
#mgNew{position:absolute;right:-6px;top:-10px;padding:2px 10px;border-radius:999px;background:linear-gradient(#ffe27a,#ffc13d);border:2px solid #fff;color:#b36a00;font-style:normal;font-weight:800;font-size:13px;transform:rotate(8deg);display:none}
#mgNew.on{display:block;animation:pillPop .6s cubic-bezier(.2,1.8,.4,1)}
.mgpface{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(100,110,200,.25))}
.mgpt{font-weight:800;font-size:40px;color:#7a72d8;-webkit-text-stroke:8px #fff;paint-order:stroke fill;text-shadow:0 5px 0 rgba(120,130,230,.4);margin-bottom:6px}
#mgFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* ===== Todo: 渡されたシャボン玉の絵に合わせた報酬・タブ ===== */
#todo .rwhead{display:block;height:46px;width:auto;margin:-4px 0 6px -2px}
#todo .nbub{width:min(23vw,92px);height:auto;border:0;background:none;box-shadow:none;border-radius:0;padding:0;transition:transform .12s ease,filter .2s}
#todo .nbub img{display:block;width:100%;height:auto;pointer-events:none}
#todo .node:not(.ready):not(.got) .nbub{opacity:.82;filter:saturate(.7) brightness(1.02)}
#todo .node.ready .nbub{opacity:1;filter:drop-shadow(0 0 7px rgba(255,205,70,.95)) drop-shadow(0 0 2px rgba(255,170,30,.9));border:0;box-shadow:none;animation:nodeReady 1s ease-in-out infinite}
#todo .node.got .nbub{opacity:.92;filter:saturate(.8);background:none;border:0}
#todo .ok{right:2px;top:-4px}
#trackLine{top:42px}
#tNav{height:76px;padding:0 6px 6px;gap:0;align-items:flex-end;border:3px solid #bdb6f2;background:linear-gradient(rgba(255,255,255,.93),rgba(233,229,252,.96));box-shadow:0 8px 22px rgba(120,110,210,.3),inset 0 2px 0 #fff}
#todo #tNav .ntab{flex:1;display:flex;align-items:flex-end;justify-content:center;padding:0;border:0;background:none;box-shadow:none;border-radius:0;transform:none;transition:transform .15s cubic-bezier(.2,1.5,.4,1);position:relative}
#todo #tNav .ntab img{display:block;width:min(16.4vw,66px);height:auto;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(110,100,200,.25))}
#todo #tNav .ntab.act{flex:1;transform:translateY(-14px) scale(1.1);padding:0;background:none;border:0;box-shadow:none}
#todo #tNav .ntab:active{transform:scale(.92)}
#todo #tNav .ntab.act:active{transform:translateY(-12px) scale(1.04)}
/* ===== ホーム画面に追加の案内(ブラウザで開いているとき) ===== */
#guide{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(90,78,152,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#guide.on{display:flex;animation:guideIn .45s cubic-bezier(.2,1.3,.4,1)}
#guide.off{animation:guideOut .25s ease forwards}
@keyframes guideIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:none}}
@keyframes guideOut{0%{opacity:1}100%{opacity:0;transform:scale(.96)}}
#guideCard{position:relative;width:min(94%,460px)}
#guideCard img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px rgba(70,60,140,.35));pointer-events:none}
#guideOk{position:absolute;left:29.8%;top:77.4%;width:41.9%;height:17.6%;border:0;background:none;border-radius:999px;cursor:pointer;transition:transform .1s ease}
#guideOk:active{transform:scale(.94)}
</style>

<script>
const $ = id => document.getElementById(id);

/* ===== キャラ(ホームに表示する子)。ガチャで増やすときはここに足す ===== */
const CHARAS = { default: { name: "default", img: "default.webp" } };
function showChara(id){ const c = CHARAS[id] || CHARAS.default; $("charaImg").src = c.img; $("charaImg").alt = c.name; }
let homeChara = "default";
try { homeChara = localStorage.getItem("home-chara") || "default"; } catch(e) {}
showChara(homeChara);

/* ===== ホーム画面に追加の案内: ブラウザで開いているときだけ、毎回出す ===== */
const isStandalone = () => window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
if (!isStandalone()) $("guide").classList.add("on");
$("guideOk").addEventListener("click", () => { const g = $("guide"); g.classList.add("off"); setTimeout(() => { g.classList.remove("on", "off"); }, 260); });

/* ===== 起動(画面のどこを押しても始まる) ===== */
let started = false;
function startApp(){
  if (started) return; started = true;
  $("title").classList.add("out"); $("home").classList.add("show");
  setTimeout(() => { $("title").style.display = "none"; }, 700);
}
$("title").addEventListener("click", startApp);

/* ===== 音(BGM・クリック音) ===== */
const AUD = {ctx:null, started:false, bgm:null, mgbgm:null, scene:"home", buf:{}, bgmGain:null, sfxGain:null, bgmVol:0.7, sfxVol:0.8};
const curBgm = () => AUD.scene === "mg" ? AUD.mgbgm : AUD.bgm;
function playBgm(){ const el = curBgm(); if (!el || AUD.bgmVol <= 0) return; const r = el.play(); if (r && r.catch) r.catch(() => {}); }
function setScene(sc){   // "home" か "mg"(ミニゲーム)。BGMを切り替える
  AUD.scene = sc; const home = AUD.bgm, mg = AUD.mgbgm;
  if (sc === "mg") { if (home) home.pause(); if (mg) { mg.currentTime = 0; } } else { if (mg) mg.pause(); }
  if (AUD.ctx && AUD.ctx.state === "suspended") AUD.ctx.resume();
  playBgm();
}
function loadSfx(name, url){   // 効果音のファイルを、すぐ鳴らせる形に読み込む
  fetch(url).then(r => r.arrayBuffer()).then(b => new Promise((ok, ng) => AUD.ctx.decodeAudioData(b, ok, ng))).then(buf => { AUD.buf[name] = buf; }).catch(() => {});
}
function playSfx(name, gain){   // 読み込めていれば true
  const b = AUD.buf[name]; if (!AUD.ctx || !b) return false; if (AUD.sfxVol <= 0) return true;
  const s = AUD.ctx.createBufferSource(), g = AUD.ctx.createGain(); s.buffer = b; g.gain.value = gain || 1; s.connect(g); g.connect(AUD.sfxGain); s.start(); return true;
}
function unlockAudio(){   // iPhoneは最初のタップまで音を出せない。タップのたびに呼ぶ
  if (!AUD.started) {
    AUD.started = true;
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e) {}
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = AUD.ctx = new C();
    AUD.bgmGain = ctx.createGain(); AUD.sfxGain = ctx.createGain();
    AUD.bgmGain.gain.value = AUD.bgmVol; AUD.sfxGain.gain.value = AUD.sfxVol;
    AUD.bgmGain.connect(ctx.destination); AUD.sfxGain.connect(ctx.destination);
    const el = AUD.bgm = new Audio("bgm.mp3"); el.loop = true; el.preload = "auto";
    try { ctx.createMediaElementSource(el).connect(AUD.bgmGain); } catch(e) {}
    const el2 = AUD.mgbgm = new Audio("mg-bgm.mp3"); el2.loop = true; el2.preload = "auto";   // ミニゲーム用のBGM

  rr(g, cx - 8, y0 + 8, 16, 18, 3); g.fillStyle = "#b8dcff"; g.fill(); g.stroke();
  rr(g, cx - 17, y0 + 22, 34, 13, 4); g.fillStyle = "#8fb8f0"; g.fill(); g.stroke();
  rr(g, x, by, pw, hgt, 18); g.fillStyle = bodyGrad(g, x, pw); g.fill(); g.stroke();
  g.fillStyle = "rgba(255,255,255,.55)"; rr(g, x + 8, by + 14, 7, 100, 3.5); g.fill();
  rr(g, x + 9, by + 40, pw - 18, 58, 10); g.fillStyle = "rgba(255,255,255,.38)"; g.fill(); sprout(g, cx, by + 68, .85);
  rr(g, x - 1.5, by + 118, pw + 3, 15, 5); g.fillStyle = "#8fb8f0"; g.fill(); g.stroke();
}
function capBottle(g, x, yEnd, pw){   // 上からぶら下がる、キャップつきの瓶。yEnd = キャップ側の先
  const capH = 17, cx = x + pw / 2; g.lineWidth = 3; g.strokeStyle = OUT; g.lineJoin = "round";
  rr(g, x, -60, pw, yEnd - capH + 66, 18); g.fillStyle = bodyGrad(g, x, pw); g.fill(); g.stroke();
  g.fillStyle = "rgba(255,255,255,.55)"; rr(g, x + 8, Math.max(8, yEnd - 150), 7, 90, 3.5); g.fill();
  rr(g, x + 9, yEnd - capH - 72, pw - 18, 58, 10); g.fillStyle = "rgba(255,255,255,.38)"; g.fill(); sprout(g, cx, yEnd - capH - 43, .85);
  rr(g, x - 2, yEnd - capH, pw + 4, capH, 6); g.fillStyle = "#8fb8f0"; g.fill(); g.stroke();
}
function hitRect(cx, cy, r, x, y, w, h){ const nx = clampN(cx, x, x + w), ny = clampN(cy, y, y + h), dx = cx - nx, dy = cy - ny; return dx * dx + dy * dy < r * r; }
function bottleDraw(g, vi, x, yTip, targetLen, flip){   // yTip = ポンプの先。flip=true で逆さ(上からぶら下がる)
  const v = BOT[vi], W = MGC.PW, sc = W / v.sw, nat = v.sh * sc, rowU = v.row * sc, botH = (v.sh - v.row) * sc, extra = Math.max(0, targetLen - nat);
  g.save(); if (flip) { g.translate(x + W, yTip); g.rotate(Math.PI); } else g.translate(x, yTip);
  g.drawImage(mgBot, v.sx, 0, v.sw, v.row, 0, 0, W, rowU);
  if (extra > 0) g.drawImage(mgBot, v.sx, v.row, v.sw, 1, 0, rowU - 0.4, W, extra + 0.8);
  g.drawImage(mgBot, v.sx, v.row, v.sw, v.sh - v.row, 0, rowU + extra, W, botH);
  g.restore();
}
function bottleHit(x, yTip, vi, flip){
  const v = BOT[vi], W = MGC.PW, H = v.sh * W / v.sw, pad = 3;
  for (const [x0, x1, y0, y1] of GEO) {
    const a = y0 * H, b = y1 >= 9 ? 900 : y1 * H, rx = x + x0 * W + pad / 2, rw = (x1 - x0) * W - pad, ry = flip ? yTip - b : yTip + a;
    if (hitRect(MG.bx, MG.by, MGC.R, rx, ry, rw, b - a)) return true;
  }
  return false;
}
function mgHit(){
  for (const p of MG.pipes) {
    const top = p.gapY - MGC.GAP / 2, bot = p.gapY + MGC.GAP / 2;
    if (bottleHit(p.x, bot, p.vb, false) || bottleHit(p.x, top, p.vt, true)) return true;
  }
  return false;
}

/* 音(ふわっとしたやさしい音) */
function sfxFlap(){ if (playSfx("jump", .55)) return; if (!AUD.ctx || AUD.sfxVol <= 0) return; const t = AUD.ctx.currentTime; tone(t, 420, 780, 0.1, 0.13, "sine"); noiseHit(t, 0.03, "highpass", 3200, 0.05); }
function sfxScore(){ if (!AUD.ctx || AUD.sfxVol <= 0) return; const t = AUD.ctx.currentTime; tone(t, 880, 1180, 0.1, 0.14, "sine"); tone(t + 0.07, 1320, 1330, 0.16, 0.12, "sine"); }
function sfxHit(){ if (playSfx("hit", .8)) return; if (!AUD.ctx || AUD.sfxVol <= 0) return; const t = AUD.ctx.currentTime; noiseHit(t, 0.14, "lowpass", 900, 0.5); tone(t, 260, 70, 0.28, 0.3, "triangle"); }

/* 進行 */
function mgSetState(st){ if (st === "idle") $("mgChar").src = pickFace(); if (st === "paused") $("mgPFace").src = pickFace(); MG.state = st; const el = $("mg"); el.classList.remove("st-start", "st-over", "st-pause", "ready", "hud"); if (st === "idle") el.classList.add("st-start"); if (st === "over") el.classList.add("st-over"); if (st === "paused") el.classList.add("st-pause", "hud"); if (st === "ready") el.classList.add("ready", "hud"); if (st === "play" || st === "dead") el.classList.add("hud"); }
function mgReset(){ MG.bx = Math.min(110, MG.W * .3); MG.by = 300; MG.vy = 0; MG.rot = 0; MG.pipes = []; MG.score = 0; MG.isNew = false; MG.deadT = 0; MG.grace = 0; MG.overShown = false; $("mgScoreNum").textContent = 0; $("mgBestNum").textContent = MG.best; }
function mgSpawn(x){ const lo = 130, hi = 640 - MGC.GROUND - 130; MG.pipes.push({x, gapY:rnd(lo, hi), passed:false, vt:Math.floor(rnd(0, 5)), vb:Math.floor(rnd(0, 5))}); }
function mgFlap(){
  if (!MG.open) return;
  if (MG.state === "ready") { mgSetState("play"); MG.vy = MGC.FLAP; MG.jumpT = .2; mgSpawn(MG.W + 30); sfxFlap(); return; }
  if (MG.state === "play") { MG.vy = MGC.FLAP; MG.jumpT = .2; sfxFlap(); }
}
function mgDie(){
  MG.state = "dead"; MG.deadT = 0; MG.flash = 1; sfxHit();
  if (MG.score > MG.best) { MG.best = MG.score; MG.isNew = true; try { localStorage.setItem(MGK, String(MG.best)); } catch(e) {} }
}
function mgOver(){
  MG.overShown = true; $("mgOScore").textContent = MG.score; $("mgOBest").textContent = MG.best; $("mgNew").classList.toggle("on", MG.isNew); mgSetState("over");
}
function mgStep(dt){
  MG.t += dt;
  if (MG.state === "idle") { MG.spd = .45; MG.by = 300; return; }
  if (MG.state === "ready") { MG.spd = .5; MG.by = 300 + Math.sin(MG.t * 4) * 8; MG.rot = 0; return; }
  if (MG.state === "paused" || MG.state === "over") { MG.spd = 0; return; }
  if (MG.grace > 0) { MG.grace -= dt; MG.spd = .3; return; }   // 再開直後は少し止まる
  const gt = 640 - MGC.GROUND;
  MG.vy += MGC.G * dt; MG.by += MG.vy * dt; MG.rot = clampN(MG.vy / 700, -.45, 1.1);
  if (MG.state === "play") {
    MG.spd = 1;
    for (const p of MG.pipes) p.x -= MGC.SPEED * dt;
    const last = MG.pipes[MG.pipes.length - 1]; if (!last || last.x < MG.W - MGC.SPACE) mgSpawn(MG.W + 30);
    while (MG.pipes.length && MG.pipes[0].x < -MGC.PW - 40) MG.pipes.shift();
    for (const p of MG.pipes) if (!p.passed && p.x + MGC.PW < MG.bx - MGC.R) { p.passed = true; MG.score++; $("mgScoreNum").textContent = MG.score; sfxScore(); }
    if (MG.by < MGC.R) { MG.by = MGC.R; if (MG.vy < 0) MG.vy = 0; }
    if (MG.by + MGC.R > gt) { MG.by = gt - MGC.R; mgDie(); }
    else if (mgHit()) mgDie();
  } else {   // dead: 地面まで落ちる
    MG.spd = 0; MG.deadT += dt;
    if (MG.by + MGC.R >= gt) { MG.by = gt - MGC.R; MG.vy = 0; }
    if (MG.deadT > .85 && !MG.overShown) mgOver();
  }
}
function mgDraw(dt){
  const g = MG.ctx; if (!g) return; g.setTransform(MG.S, 0, 0, MG.S, 0, 0);
  mgBg(g, dt);
  for (const p of MG.pipes) {
    if (mgBot.complete && mgBot.naturalWidth) { bottleDraw(g, p.vt, p.x, p.gapY - MGC.GAP / 2, p.gapY - MGC.GAP / 2 + 90, true); bottleDraw(g, p.vb, p.x, p.gapY + MGC.GAP / 2, 720 - (p.gapY + MGC.GAP / 2), false); }
    else { capBottle(g, p.x, p.gapY - MGC.GAP / 2, MGC.PW); pumpBottle(g, p.x, p.gapY + MGC.GAP / 2, MGC.PW); }
  }
  mgGround(g, dt);
  if (MG.state !== "idle" && MG.state !== "over" && mgFly.complete && mgFly.naturalWidth) {
    const k = 74 / mgFly.naturalWidth, im = (MG.jumpT > 0 && mgJump.complete && mgJump.naturalWidth) ? mgJump : mgFly, w = im.naturalWidth * k, h = im.naturalHeight * k;
    MG.jumpT = Math.max(0, MG.jumpT - dt); g.save(); g.translate(MG.bx, MG.by); g.rotate(im === mgJump ? MG.rot * .5 : MG.rot); g.drawImage(im, -w / 2, -h / 2 - 2, w, h); g.restore();
  }
  if (MG.flash > 0) { MG.flash = Math.max(0, MG.flash - dt * 3); $("mgFlash").style.opacity = MG.flash * .7; }
}
function mgLoop(ts){
  if (!MG.open) return;
  const dt = Math.min((ts - MG.last) / 1000, 1 / 30) || 0; MG.last = ts;
  mgStep(dt); mgDraw(dt); MG.raf = requestAnimationFrame(mgLoop);
}
function openMg(){
  setScene("mg");   // スタート画面からミニゲームのBGM
  MG.open = true; const el = $("mg"); el.classList.add("open"); mgResize(); mgReset(); mgSetState("idle");
  MG.last = performance.now(); cancelAnimationFrame(MG.raf); MG.raf = requestAnimationFrame(mgLoop);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
}
function closeMg(){ setScene("home"); const el = $("mg"); el.classList.remove("on"); MG.open = false; cancelAnimationFrame(MG.raf); setTimeout(() => el.classList.remove("open"), 300); }
$("mgCanvas").addEventListener("pointerdown", e => { e.preventDefault(); mgFlap(); });
$("mgGo").addEventListener("click", () => { mgReset(); mgSetState("ready"); });
$("mgRetry").addEventListener("click", () => { mgReset(); mgSetState("ready"); });
$("mgTop").addEventListener("click", closeMg);
$("mgX").addEventListener("click", closeMg);
$("mgPause").addEventListener("click", () => { if (MG.state === "play") { MG.prev = "play"; mgSetState("paused"); } else if (MG.state === "ready") { MG.prev = "ready"; mgSetState("paused"); } });
$("mgResume").addEventListener("click", () => { if (MG.prev === "play") MG.grace = .8; mgSetState(MG.prev); });
$("mgPTop").addEventListener("click", closeMg);
document.addEventListener("visibilitychange", () => { if (document.hidden && MG.open && MG.state === "play") { MG.prev = "play"; mgSetState("paused"); } });
